<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: beige;
        }

        nav ul {
            display: flex;
            justify-content: space-evenly;
            list-style-type: none;
            padding: 0;        }

        nav ul li {
            margin: 0px 20px 0px 20px;
            background-color: burlywood;
            padding: 10px;
            border: 5px ridge darkcyan;
            border-radius: 10px;
            transition: 0.5s;
        }

        nav ul li:hover {
            background-color: antiquewhite;
            margin: 0px;
            padding: 20px 30px 20px 30px;
            filter: drop-shadow(8px 8px 10px gray);
            transition: 0.5s;
        }

        article {
            background-color: gainsboro;
            width: 75%;
            border-width: 5px;
            border-style: dashed;
            border-color: black;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            background-image: url(https://static.wikia.nocookie.net/all-fiction-battles/images/b/bf/Gyro.jpg/revision/latest?cb=20210209001634) no-repeat fixed;
        }
    </style>
</head>

<body>
    <h1>Page Header</h1>
    <nav>
        <ul>
            <li><a href="#">Link</a></li>
            <li><a href="#">Link</a></li>
            <li><a href="#">Link</a></li>
            <li><a href="#">Link</a></li>
            <li><a href="#">Link</a></li>
        </ul>
    </nav>
    <article>
        <h2>Article Title</h2>
        <p>Pavlo Mancenido</p>
        <footer>
            &copy; 2026
        </footer>
    </article>
    <button><big><a href="#">Button</a></big></button>
</body>

</html>
